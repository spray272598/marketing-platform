server:
  grpc:
    addr: 0.0.0.0:18081
    timeout: 1s
  http:
    addr: 0.0.0.0:18091
    timeout: 1s

data:
  database:
    driver: mysql
    source: root:root@tcp(127.0.0.1:3306)/marketing_seckill?charset=utf8mb4&parseTime=True&loc=Local
  redis:
    addr: 127.0.0.1:6379
    read_timeout: 0.2s
    write_timeout: 0.2s

registry:
  endpoints:
    - 127.0.0.1:8848

log:
  level: info
