server:
  http:
    addr: 0.0.0.0:18092
    timeout: 10s

data:
  database:
    driver: mysql
    source: ${MYSQL_DSN:root:root@tcp(127.0.0.1:3306)/marketing_groupbuy?charset=utf8mb4&parseTime=True&loc=Local}
    debug: true
    auto_migrate: true
  redis:
    addr: ${REDIS_ADDR:127.0.0.1:6379}
    password: ""
    db: 0
    read_timeout: 0.2s
    write_timeout: 0.2s
  rabbitmq:
    url: ${RABBITMQ_URL:amqp://guest:guest@127.0.0.1:5672/}
  stock:
    url: ${STOCK_URL:http://127.0.0.1:18094}
