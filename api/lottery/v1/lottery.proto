syntax = "proto3";

package lottery.v1;

option go_package = "github.com/marketing-platform/api/lottery/v1;lotteryv1";

// 抽奖服务
service LotteryService {
  // 查询抽奖活动
  rpc QueryLotteryActivity(QueryLotteryActivityReq) returns (QueryLotteryActivityResp);
  // 查询抽奖策略
  rpc QueryLotteryStrategy(QueryLotteryStrategyReq) returns (QueryLotteryStrategyResp);
  // 执行抽奖
  rpc Raffle(RaffleReq) returns (RaffleResp);
  // 查询用户抽奖记录
  rpc QueryUserRaffleOrder(QueryUserRaffleOrderReq) returns (QueryUserRaffleOrderResp);
}

message QueryLotteryActivityReq {
  string activity_id = 1;
}

message QueryLotteryActivityResp {
  string activity_id = 1;
  string activity_name = 2;
  string strategy_id = 3;
  int32 activity_state = 4;
}

message QueryLotteryStrategyReq {
  string strategy_id = 1;
}

message QueryLotteryStrategyResp {
  string strategy_id = 1;
  repeated StrategyAward awards = 2;
  repeated StrategyRule rules = 3;
}

message StrategyAward {
  string award_id = 1;
  string award_name = 2;
  double award_rate = 3;
  int32 award_count = 4;
}

message StrategyRule {
  string rule_model = 1;
  string rule_value = 2;
}

message RaffleReq {
  string activity_id = 1;
  int64 user_id = 2;
}

message RaffleResp {
  string award_id = 1;
  string award_name = 2;
  int32 award_state = 3;
  string award_time = 4;
}

message QueryUserRaffleOrderReq {
  string activity_id = 1;
  int64 user_id = 2;
}

message QueryUserRaffleOrderResp {
  int32 total_count = 1;
  int32 day_count = 2;
  int32 month_count = 3;
  int32 used_count = 4;
}
