syntax = "proto3";

package seckill.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/marketing-platform/api/seckill/v1;seckillv1";

service SeckillService {
  rpc QuerySeckillActivity(QuerySeckillActivityReq) returns (QuerySeckillActivityResp) {
    option (google.api.http) = {
      get: "/api/v1/seckill/activity/query"
    };
  }

  rpc CreateSeckillOrder(CreateSeckillOrderReq) returns (CreateSeckillOrderResp) {
    option (google.api.http) = {
      post: "/api/v1/seckill/order/create"
      body: "*"
    };
  }

  rpc QuerySeckillOrder(QuerySeckillOrderReq) returns (QuerySeckillOrderResp) {
    option (google.api.http) = {
      get: "/api/v1/seckill/order/query"
    };
  }
}

message QuerySeckillActivityReq {
  string activity_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message QuerySeckillActivityResp {
  string activity_id = 1;
  string activity_name = 2;
  string sku_id = 3;
  int32 total_count = 4;
  int32 limit_count = 5;
  int32 activity_state = 6;
  string start_time = 7;
  string end_time = 8;
}

message CreateSeckillOrderReq {
  string activity_id = 1 [(google.api.field_behavior) = REQUIRED];
  int64 user_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message CreateSeckillOrderResp {
  string order_id = 1;
  string activity_id = 2;
  int32 order_state = 3;
  string order_time = 4;
}

message QuerySeckillOrderReq {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  int64 user_id = 2;
}

message QuerySeckillOrderResp {
  string order_id = 1;
  string activity_id = 2;
  int64 user_id = 3;
  string sku_id = 4;
  int32 order_state = 5;
  string order_time = 6;
  string pay_time = 7;
}
