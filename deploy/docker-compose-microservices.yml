version: '3.8'

services:
  nacos:
    image: nacos/nacos-server:v2.1.0
    container_name: nacos
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=123456
    ports:
      - "8848:8848"
      - "9848:9848"
    depends_on:
      - mysql
    networks:
      - marketing-net

  skywalking-oap:
    image: apache/skywalking-oap-server:8.16.0-java8
    container_name: skywalking-oap
    environment:
      - SW_STORAGE=mysql
      - SW_STORAGE_MYSQL_HOST=mysql
      - SW_STORAGE_MYSQL_PORT=3306
      - SW_STORAGE_MYSQL_DATABASE=skywalking
      - SW_STORAGE_MYSQL_USER=root
      - SW_STORAGE_MYSQL_PASSWORD=123456
    ports:
      - "11800:11800"
      - "12800:12800"
    depends_on:
      - mysql
    networks:
      - marketing-net

  skywalking-ui:
    image: apache/skywalking-ui:8.16.0
    container_name: skywalking-ui
    environment:
      - SW_OAP_ADDRESS=http://skywalking-oap:12800
    ports:
      - "8081:8080"
    depends_on:
      - skywalking-oap
    networks:
      - marketing-net

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - marketing-net

  grafana:
    image: grafana/grafana:9.5.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # 通过挂载的 provisioning 自动注册 Prometheus 数据源与大盘，启动即可用。
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - marketing-net

  mysql:
    image: mysql:8.0.33
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=marketing
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - marketing-net

  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server
    networks:
      - marketing-net

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - marketing-net

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - nacos
    networks:
      - marketing-net

  seckill-market:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.seckill
    container_name: seckill-market
    ports:
      - "18091:18091"
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - MYSQL_DSN=root:root@tcp(mysql:3306)/marketing_seckill?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - STOCK_URL=http://stock-market:18094
      - SPRING_PROFILES_ACTIVE=docker
      - MARKETING_AUTH_SECRET=${MARKETING_AUTH_SECRET:-please-change-this-jwt-secret}
      - MARKETING_INTERNAL_TOKEN=${MARKETING_INTERNAL_TOKEN:-internal-dev-token}
    depends_on:
      - nacos
      - mysql
      - redis
      - rabbitmq
    networks:
      - marketing-net

  groupbuy-market:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.groupbuy
    container_name: groupbuy-market
    ports:
      - "18092:18092"
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - MYSQL_DSN=root:root@tcp(mysql:3306)/marketing_groupbuy?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - STOCK_URL=http://stock-market:18094
      - SPRING_PROFILES_ACTIVE=docker
      - MARKETING_AUTH_SECRET=${MARKETING_AUTH_SECRET:-please-change-this-jwt-secret}
      - MARKETING_INTERNAL_TOKEN=${MARKETING_INTERNAL_TOKEN:-internal-dev-token}
    depends_on:
      - nacos
      - mysql
      - redis
    networks:
      - marketing-net

  lottery-market:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.lottery
    container_name: lottery-market
    ports:
      - "18093:18093"
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - MYSQL_DSN=root:root@tcp(mysql:3306)/marketing_lottery?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - STOCK_URL=http://stock-market:18094
      - SPRING_PROFILES_ACTIVE=docker
      - MARKETING_AUTH_SECRET=${MARKETING_AUTH_SECRET:-please-change-this-jwt-secret}
      - MARKETING_INTERNAL_TOKEN=${MARKETING_INTERNAL_TOKEN:-internal-dev-token}
    depends_on:
      - nacos
      - mysql
      - redis
    networks:
      - marketing-net

  stock-market:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.stock
    container_name: stock-market
    ports:
      - "18094:18094"
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - MYSQL_DSN=root:root@tcp(mysql:3306)/marketing_stock?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_ADDR=redis:6379
      - SPRING_PROFILES_ACTIVE=docker
      - MARKETING_AUTH_SECRET=${MARKETING_AUTH_SECRET:-please-change-this-jwt-secret}
      - MARKETING_INTERNAL_TOKEN=${MARKETING_INTERNAL_TOKEN:-internal-dev-token}
    depends_on:
      - nacos
      - mysql
      - redis
    networks:
      - marketing-net

networks:
  marketing-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  nacos-data:
