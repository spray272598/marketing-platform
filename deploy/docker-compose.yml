version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: marketing-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - marketing-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: marketing-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - marketing-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: marketing-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - marketing-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  seckill:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: seckill
    container_name: marketing-seckill
    environment:
      MYSQL_DSN: "root:root@tcp(mysql:3306)/marketing_seckill?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: "redis:6379"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    ports:
      - "18091:18091"
    networks:
      - marketing-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  groupbuy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: groupbuy
    container_name: marketing-groupbuy
    environment:
      MYSQL_DSN: "root:root@tcp(mysql:3306)/marketing_groupbuy?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: "redis:6379"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    ports:
      - "18092:18092"
    networks:
      - marketing-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  lottery:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: lottery
    container_name: marketing-lottery
    environment:
      MYSQL_DSN: "root:root@tcp(mysql:3306)/marketing_lottery?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: "redis:6379"
    ports:
      - "18093:18093"
    networks:
      - marketing-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  stock:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: stock
    container_name: marketing-stock
    environment:
      MYSQL_DSN: "root:root@tcp(mysql:3306)/marketing_stock?charset=utf8mb4&parseTime=True&loc=Local"
    ports:
      - "18094:18094"
    networks:
      - marketing-net
    depends_on:
      mysql:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: gateway
    container_name: marketing-gateway
    ports:
      - "8080:8080"
    networks:
      - marketing-net
    depends_on:
      - seckill
      - groupbuy
      - lottery
      - stock

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:

networks:
  marketing-net:
    driver: bridge
